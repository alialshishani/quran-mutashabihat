# All thresholds and weights live here. Nothing in pipeline/ hardcodes a value
# that appears in this file (brief section 11).

detection:
  # Normalization profile the detection stream is built from.
  profile: standard

  pass_a:
    # Shortest repeated span worth reporting, in tokens. Below 3 the output is
    # dominated by common particle pairs that no memoriser confuses.
    min_span_tokens: 3
    # A span must appear at least this many times to form a group.
    min_occurrences: 2
    # Spans that run across a surah boundary are recorded but flagged, because
    # a "phrase" spanning the seam between two surahs is an artefact of the
    # global token stream rather than a phrase a reciter holds in memory.
    flag_cross_surah: true

rules:
  r1_majority:
    # "All the positions take X except one, in surah ___."
    # Needs enough positions for a majority to mean anything.
    min_occurrences: 3
    # Largest minority still describable as "except one/a few".
    max_minority_count: 2
    # Majority must hold at least this share of the positions. 0.75 is the
    # weakest split still honestly describable as "all except one or a few":
    # at 0.6 a 3-versus-2 split would qualify, which is not a majority a
    # memoriser can lean on.
    min_majority_share: 0.75
    # Prior weight, before verification confidence is applied.
    prior: 0.9

pegs:
  # A peg identifies ONE position of a shared phrase among all the positions a
  # reciter could confuse it with. It is verified against the confusion set, not
  # asserted: the cue must be carried by this position and by no other.
  #
  # The confusion set is the union of the official mutashābihāt list for the
  # phrase and every exact repeat of it in the muṣḥaf. Neither source alone is
  # the whole set — the official list omits real repeats, and exact matching
  # misses the near-variants that make a phrase confusable in the first place.
  confusion_set:
    # Fold exact repeats of the phrase into its official position list.
    include_exact_repeats: true

  cue:
    # Widest cue worth offering. Past four words the "cue" is just more recitation
    # and stops being a peg a memoriser can hold.
    max_window: 4
    # Cues and continuations are compared on the normalization profile below, so
    # orthographic variants of one word do not read as a distinction.
    profile: standard

  strength:
    # A one-word cue is the strongest peg there is; each extra word needed costs.
    cue_before: 0.95
    per_extra_cue_word: 0.1
    # The sūrah is a cue the reciter always has, but it only resolves the position
    # when the phrase occurs there once.
    sole_in_surah: 0.75
    # Counting occurrences within a sūrah is a real peg but the most fragile one.
    ordinal_in_surah: 0.55
    # Applied when the continuation is not unique either — the peg tells the
    # reciter where they are, but not yet what makes this position different.
    ambiguous_payload: 0.85

output:
  # Ranking cap for the human-readable report.
  max_groups_in_report: 200
